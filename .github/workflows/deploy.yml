name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A6473A: ${{ secrets.A6473A }}
          BE04EE: ${{ secrets.BE04EE }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('A6473A', ''), os.environ.get('BE04EE', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 5c034a2b849a6ebddb7d478c06962c394d -->', a)
          if b:
              patched = patched.replace('<!-- 5450ee64e6b93584340f7256143905e57a3612c0cf -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
